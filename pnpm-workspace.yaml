allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  netlify-cli: false
  sharp: false
  unix-dgram: false
  unrs-resolver: false

# Security patches for transitive deps (mostly netlify-cli, eslint, commitlint)
overrides:
  "@fastify/busboy@3": ^3.2.4
  baseline-browser-mapping: ^2.11.33
  body-parser@2: ^2.4.0
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  browserslist: ^4.29.4
  fast-uri: ^3.1.9
  fastify@5: ^5.12.7
  find-my-way@9: ^9.10.0
  follow-redirects: ^1.16.2
  http-proxy-middleware@3: ^3.0.10
  js-yaml@4: ^4.3.2
  multiparty: ^4.3.1
  nanoid@3: ^3.3.20
  postcss: ^8.5.31
  qs: ^6.16.1
  smol-toml: ^1.9.1
  source-map-js: ^1.2.2
  tar@7: ^7.5.22
  toml: ^5.0.1
  ws@8: ^8.22.0
  zod@4: ^4.6.7
