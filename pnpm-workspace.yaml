allowBuilds:
  "@parcel/watcher": false
  esbuild: false
  netlify-cli: false
  sharp: false
  unix-dgram: false
  unrs-resolver: false

# Security patches for transitive deps (mostly netlify-cli, eslint, commitlint).
# Floors are the first patched version of each advisory.
overrides:
  "@fastify/busboy@3": ^3.2.2
  baseline-browser-mapping: ^2.11.0
  body-parser@2: ^2.4.0
  brace-expansion@1: ^1.1.21
  brace-expansion@5: ^5.0.12
  browserslist: ^4.28.7
  fast-uri: ^3.1.9
  fastify@5: ^5.12.5
  find-my-way@9: ^9.6.1
  follow-redirects: ^1.16.1
  http-proxy-middleware@3: ^3.0.7
  js-yaml@4: ^4.3.2
  multiparty: ^4.2.4
  nanoid@3: ^3.3.18
  postcss: ^8.5.23
  qs: ^6.16.0
  smol-toml: ^1.8.1
  source-map-js: ^1.2.2
  tar@7: ^7.5.21
  toml: ^5.0.1
  ws@8: ^8.21.0
  zod@4: ^4.6.6
